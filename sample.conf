# axigate configuration sample
# Equivalent to: axigate -h 192.168.0.9 -p 8144 -c SR5DZ -s 0 -v

# TCP TNC connection
host=192.168.0.9
port=8144

# Or use Unix socket instead (comment out host/port above)
# socket=/tmp/tnc.sock

# Gateway identity (for APRS-IS)
call=SR5DZ
ssid=0

# Logging level: standard, verbose, debug
log-level=verbose

# Enable dry run mode (true/false)
# In dry run mode, packets are logged but not transmitted
dry-run=false
