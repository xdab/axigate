# axigate configuration sample
# Equivalent to: axigate -h 192.168.0.9 -p 8144 -c SR5DZ -s 0 -v

# TCP TNC connection
host=192.168.0.9
port=8144

# Or use Unix socket instead (comment out host/port above)
# socket=/tmp/tnc.sock

# Gateway identity (for APRS-IS)
call=SR5DZ
ssid=0

# APRS-IS connection
is-host=195.225.77.3
is-filter=m/30
is-passcode=-1

# APRS-IS keepalive: minimum seconds between re-sent login lines
# keeps idle connections alive and detects silent drops (0 = disabled)
# is-keepalive=300

# UDP injection inputs (0 = disabled)
# Local tools (e.g. cron beacon scripts) can send packets to these ports;
# they are gated to APRS-IS like RF traffic (requires rf-to-is=true)
# udp-kiss-listen=0
# udp-tnc2-listen=0

# Logging level: standard, verbose, debug
log-level=verbose

# Enable directional forwarding (true/false)
# rf-to-is: forward packets from RF to APRS-IS
# is-to-rf: forward packets from APRS-IS to RF
rf-to-is=true
is-to-rf=false
